<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Syncpond</title>
<meta name="description" content="A spatial sequencer: place nodes in a pond, let their ripples trigger each other, and listen. Inspired by Zach Gage's synthPond.">
<link rel="icon" type="image/png" sizes="32x32" href="/logos/syncpond-32.png">
<link rel="icon" type="image/svg+xml" href="/logos/syncpond.svg">
<link rel="apple-touch-icon" href="/logos/syncpond-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Syncpond">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04161c">
<style>
/* The pond is everything; controls float on it like things left at the water's edge. */
:root{--water:#04161c;--deep:#020b0f;--foam:#e8f4f2;--mist:#8fb0ae;--glass:rgba(8,34,42,.82);--edge:rgba(232,244,242,.18);--hot:#ff5d4d;
  --ui:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--foam);font:15px/1.35 var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--foam);outline-offset:2px}
[hidden]{display:none!important}
#pond{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:fixed;z-index:2;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));border-radius:26px;height:52px;display:flex;align-items:center;gap:4px;padding:0 6px}
#top h1{font-size:17px;font-weight:700;margin:0 auto 0 10px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(232,244,242,.1)}
.ib svg{width:22px;height:22px}
#rec.on{background:var(--hot)} #rec.on svg{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
#tempoBtn{height:44px;padding:0 12px;border-radius:22px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
#tools{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);border-radius:30px;display:flex;gap:2px;padding:5px}
#tools button{width:62px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--mist)}
#tools button svg{width:22px;height:22px}
#tools button[aria-pressed=true]{background:var(--foam);color:var(--water)}
.sheet{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px;padding:14px;max-height:72vh;overflow-y:auto;z-index:3;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.sheet h3{margin:4px 0 -4px;font-size:13px;font-weight:600;color:var(--mist)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--edge);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--foam);color:var(--water);border-color:var(--foam)}
.chip.fx{height:36px;padding:0 12px;font-size:13px}
.chip.warn{color:#ffb4ab;border-color:#ffb4ab66}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.strip button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;min-width:0}
.strip button[aria-pressed=true]{border-color:var(--foam);transform:scale(1.12)}
.seq{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.seq button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;font-size:12px}
.seq button.rest{background:none;border:1.5px dashed var(--mist)}
.seq button[aria-pressed=true]{border-color:var(--foam)}
.seq .add{border:1px solid var(--edge);border-radius:15px;width:auto;padding:0 10px;font-size:13px}
label.sl{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:14px}
label.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mist);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:28px;margin:0;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--foam);margin-top:-10px}
select,input[type=text]{height:40px;border-radius:20px;border:1px solid var(--edge);background:rgba(0,0,0,.25);padding:0 12px;font-size:16px;min-width:0}
.list{display:flex;flex-direction:column;gap:4px}
.list div{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border-radius:14px;background:rgba(0,0,0,.22)}
.list span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--mist);margin:0}
#hint{position:fixed;left:0;right:0;top:42%;text-align:center;pointer-events:none;z-index:1;padding:0 30px;font-size:17px;color:var(--mist);transition:opacity .5s}
#toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;background:var(--foam);color:var(--water);font-weight:700;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:760px){.sheet{left:auto;right:12px;bottom:auto;top:calc(74px + env(safe-area-inset-top,0px));width:372px;max-height:calc(100vh - 96px);margin:0}}
@media(max-width:759px){#nodeSheet{padding:10px 12px;gap:8px}#nodeSheet h2{font-size:16px}#nodeSheet .chip{height:36px;padding:0 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="pond" aria-label="The pond. Tap to place a node, drag to move it, tap a node to edit it."></canvas>
<div id="hint">Tap the water to drop a node.<br>Round ones send ripples. Square ones ring when a ripple reaches them.</div>
<div class="float" id="top">
  <h1 id="pname">Syncpond</h1>
  <button id="tempoBtn" class="ib" style="width:auto" title="Tempo" aria-label="Tempo"></button>
  <button class="ib" id="play" aria-label="Pause the pond"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg></button>
  <button class="ib" id="rec" aria-label="Record to MP3"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor"/></svg></button>
  <button class="ib" id="menu" aria-label="Pond settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12M20 17h0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.2" fill="currentColor"/><circle cx="9" cy="12" r="2.2" fill="currentColor"/><circle cx="18" cy="17" r="2.2" fill="currentColor"/></svg></button>
</div>
<div class="float" id="tools" role="group" aria-label="Node to place">
  <button data-t="e1" aria-pressed="true" title="Sends a ripple every beat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>Beat</button>
  <button data-t="e2" aria-pressed="false" title="Sends a ripple every second beat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>Half</button>
  <button data-t="re" aria-pressed="false" title="Rings when a ripple reaches it"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>Ring</button>
  <button data-t="rf" aria-pressed="false" title="Rings and sends the ripple on"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/></svg>Echo</button>
</div>
<div class="float sheet" id="nodeSheet" hidden></div>
<div class="float sheet" id="setSheet" hidden></div>
<input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aif,.aiff,.caf" hidden>
<div id="toast" role="status"></div>

};
let more = false; const wide = () => matchMedia("(min-width:760px)").matches;
let P, sel = null, tool = "e1", picking = false, waves = [], lastPitch = 5, seqSel = 0;

  P.nodes = (p.nodes || []).slice(0, MAXN).map(n => { const m = mk(TYPES[n.type] ? n.type : "re", +n.x || 0, +n.y || 0, (Array.isArray(n.seq) && n.seq.length ? n.seq : [4]).slice(0, STEPS).map(s => clamp(s | 0, -1, STEPS - 1)), { voice: n.voice || "bell", fx: Object.assign({}, n.fx), orbit: n.orbit ? { ...n.orbit } : null }); m.old = n.id; return m; });

  P.nodes.forEach(n => delete n.old); waves = []; sel = null; }
const pack = () => JSON.stringify(P, (k, v) => k === "si" || k === "flash" || k === "cool" ? undefined : typeof v === "number" ? Math.round(v * 1000) / 1000 : v);
function persist(){ clearTimeout(persist.t); persist.t = setTimeout(() => { try { localStorage.setItem("syncpond.now", pack()); } catch (e) {} }, 300); }
const b64 = { enc: s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""), dec: s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))) };

  try { const s = localStorage.getItem("syncpond.now"); if (s) return adopt(JSON.parse(s)); } catch (e) {} adopt(EXAMPLES["First ripples"]()); })();
let undoPond = null;

/* ---------- sound ---------- */
let ac = null, master, revSend, recTap, delayIn, delayNode, pulse = 0, heartG, samples = new Map(), playing = true, pt = 0, lastAc = 0, stats = { hits: 0, emits: 0 };

}

function freq(step, cents){ const sc = SCALES[P.scale] || SCALES.Pentatonic, m = 48 + P.key + 12 * Math.floor(step / sc.length) + sc[step % sc.length]; return 440 * Math.pow(2, (m - 69) / 12 + (cents || 0) / 1200); }

// One node sounds. strength 0..1 (how close the ripple's source was), tp = pond time of the event.
function ring(n, tp, strength){

      el("button", { class: "chip warn", onclick: () => { undoPond = pack(); const keep = P.name; adopt(Object.assign(JSON.parse(pack()), { nodes: [] })); P.name = keep; re(); toast("Pond emptied"); } }, "Empty the pond"),
      undoPond && el("button", { class: "chip", onclick: () => { const u = undoPond; undoPond = null; adopt(JSON.parse(u)); mix(); re(); } }, "Undo")),
    el("h3", {}, "My sounds"),
    el("div", { class: "list" }, [...samples.values()].map(sm => el("div", {}, el("span", {}, "♪ " + sm.name), el("button", { class: "chip", onclick: () => { audio(); voice("s:" + sm.id, 261.63, ac.currentTime + 0.02, 0.6, 1, master); } }, "Hear"), el("button", { class: "chip warn", "aria-label": "Delete " + sm.name, onclick: async () => { samples.delete(sm.id); try { await idb("readwrite", st => st.delete(sm.id)); } catch (e) {} setSheet(); } }, "✕")))),
    el("div", { class: "row" }, el("button", { class: "chip", onclick: () => { addFor = null; $("file").click(); } }, "Add a sound file")),
    el("p", { class: "note" }, "Short sounds work best: a note, a voice, a glass. They are played higher and lower to follow each node's colour, and stay on this device. Shared links do not carry them."));
}
function head(){ if (navigator.mediaSession && ac) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: P.name, artist: "Syncpond" }); navigator.mediaSession.playbackState = playing ? "playing" : "paused"; } catch (e) {} } $("pname").textContent = P.name; $("tempoBtn").textContent = P.tempo + " bpm"; $("playIcon").setAttribute("d", playing ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5l11 7-11 7z"); $("play").setAttribute("aria-label", playing ? "Pause the pond" : "Play the pond"); }
$("menu").onclick = () => { if ($("setSheet").hidden) setSheet(); else { $("setSheet").hidden = true; $("tools").hidden = false; } };
$("tempoBtn").onclick = () => $("menu").onclick();
$("play").onclick = () => { audio(); playing = !playing; head(); };
for (const b of $("tools").children) b.onclick = () => { tool = b.dataset.t; for (const c of $("tools").children) c.setAttribute("aria-pressed", String(c === b)); };
addEventListener("keydown", e => { if (e.target.matches("input,select")) return; if (e.code === "Space") { e.preventDefault(); $("play").onclick(); } if ((e.key === "Backspace" || e.key === "Delete") && sel) { P.nodes = P.nodes.filter(m => m !== sel); sel = null; persist(); nodeSheet(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && ac) { lastAc = ac.currentTime; if (ac.state !== "running") ac.resume(); } });

/* ---------- own sounds (kept in the browser) ---------- */
let addFor = null, dbp = null;
function idb(mode, fn){ dbp = dbp || new Promise((res, rej) => { const r = indexedDB.open("syncpond", 1); r.onupgradeneeded = () => r.result.createObjectStore("sounds", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return dbp.then(d => new Promise((res, rej) => { const tx = d.transaction("sounds", mode), rq = fn(tx.objectStore("sounds")); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); })); }
const decode = bytes => new Promise((res, rej) => { const p = ac.decodeAudioData(bytes.slice(0), res, rej); if (p && p.catch) p.catch(rej); });
async function loadSamples(){ try { for (const r of await idb("readonly", st => st.getAll()) || []) { try { samples.set(r.id, { id: r.id, name: r.name, buf: await decode(r.bytes) }); } catch (e) {} } } catch (e) {} }
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return; audio();
  try { const bytes = await f.arrayBuffer(); let buf = await decode(bytes);
    if (buf.duration > 12) { const n = Math.floor(12 * buf.sampleRate), cut = ac.createBuffer(buf.numberOfChannels, n, buf.sampleRate); for (let c = 0; c < buf.numberOfChannels; c++) cut.copyToChannel(buf.getChannelData(c).subarray(0, n), c); buf = cut; }
    const id = "u" + Date.now().toString(36), name = f.name.replace(/\.[^.]+$/, "").slice(0, 24) || "Sound"; samples.set(id, { id, name, buf });
    try { await idb("readwrite", st => st.put({ id, name, bytes })); } catch (err) { toast("Added for now, but it could not be stored"); }
    if (addFor) { addFor.voice = "s:" + id; persist(); sel = addFor; nodeSheet(); ring(addFor, pt, 0.8); } else setSheet();
    toast("Added " + name + (f.size > 3e6 ? " (first 12 seconds)" : ""));
  } catch (err) { toast("This file could not be read as sound"); }
};

/* ---------- record to MP3 ---------- */
let recNode = null, recL = [], recR = [], recLen = 0;
function lame(){ return window.lamejs ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement("script"); s.src = "vendor/lame.min.js"; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function toMp3(L, R, rate){

  for (let i = 0; i < L.length; i += B) { const d = enc.encodeBuffer(i16(L.subarray(i, i + B)), i16(R.subarray(i, i + B))); if (d.length) out.push(new Uint8Array(d)); if (i % (B * 20) === 0) await new Promise(r => setTimeout(r)); }
  const d = enc.flush(); if (d.length) out.push(new Uint8Array(d)); return new Blob(out, { type: "audio/mpeg" });
}
$("rec").onclick = async () => {
  audio();
  if (!recNode) { recL = []; recR = []; recLen = 0; recNode = ac.createScriptProcessor(4096, 2, 2);
    recNode.onaudioprocess = e => { if (recLen > ac.sampleRate * 600) return; recL.push(new Float32Array(e.inputBuffer.getChannelData(0))); recR.push(new Float32Array(e.inputBuffer.getChannelData(1))); recLen += 4096; };
    const mute = ac.createGain(); mute.gain.value = 0; recTap.connect(recNode); recNode.connect(mute); mute.connect(ac.destination); recNode.mute = mute;
    $("rec").classList.add("on"); $("rec").setAttribute("aria-label", "Stop recording and save MP3"); if (!playing) $("play").onclick(); return toast("Recording. Tap again to save an MP3."); }
  recTap.disconnect(recNode); recNode.disconnect(); recNode.mute.disconnect(); recNode = null; $("rec").classList.remove("on"); $("rec").setAttribute("aria-label", "Record to MP3");
  if (recLen < 8192) return toast("Too short to save");
  toast("Making the MP3…"); const join = a => { const o = new Float32Array(recLen); let p = 0; for (const c of a) { o.set(c, p); p += c.length; } return o; };
  try { const blob = await toMp3(join(recL), join(recR), ac.sampleRate), name = "syncpond-" + (P.name || "pond").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".mp3"; window.__lastMp3 = blob.size;
    const file = new File([blob], name, { type: "audio/mpeg" });
    if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; } }
    const a = el("a", { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Saved " + name);
  } catch (e) { toast("The MP3 could not be made"); }
  recL = []; recR = [];
};
head(); if (P.nodes.length) setTimeout(() => $("hint").textContent = "Tap anywhere to start the sound.", 0); requestAnimationFrame(draw);
window.__pond = { get P(){ return P; }, stats, get pulse(){ return pulse; }, get waves(){ return waves; }, get pt(){ return pt; }, samples };
</script>
