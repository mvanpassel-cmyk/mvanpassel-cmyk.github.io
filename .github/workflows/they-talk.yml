name: They Talk conversation

on:
  schedule:
    # Weekly, Monday early UTC (GitHub often starts scheduled runs hours late).
    # Each week: one conversation (news and open alternate) plus one "found in the wild" item.
    - cron: "23 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to make (ignored when a link or topic is filled in)"
        type: choice
        options: [auto, news, open, found]
        default: auto
      url:
        description: "Article link for a news conversation (optional)"
        type: string
        default: ""
      topic:
        description: "Or a topic / question without an article (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: they-talk
  cancel-in-progress: false

jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s they-talk/tests -v

      - name: Let the two agents talk
        id: talk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # off for now; uncomment to make Agent B an OpenAI model
          MODE: ${{ github.event.inputs.mode }}
          SUGGEST_URL: ${{ github.event.inputs.url }}
          SUGGEST_TOPIC: ${{ github.event.inputs.topic }}
        run: python they-talk/pipeline/talk.py

      - name: Commit (also the status note when the run failed)
        if: always()
        run: |
          git config user.name "they-talk bot"
          git config user.email "actions@users.noreply.github.com"
          git add they-talk/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "They Talk: weekly update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
