name: Vacaturemonitor daily update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vacatures/pipeline/**"
      - "vacatures/tests/**"
      - "vacatures/data/sources.json"
      - "vacatures/data/employers.json"
      - "vacatures/data/archive-key.json"
      - ".github/workflows/vacatures.yml"

permissions:
  contents: write

concurrency:
  group: vacatures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install encryption library
        run: python -m pip install --quiet cryptography

      - name: Unit tests
        run: python -m unittest discover -s vacatures/tests -v

      - name: Fetch new vacancies, update status, archive copies and encrypted texts
        run: python vacatures/pipeline/update.py

      - name: Commit if changed
        run: |
          git config user.name "vacatures bot"
          git config user.email "actions@users.noreply.github.com"
          git add vacatures/data vacatures/archief
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Vacaturemonitor: daily update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
