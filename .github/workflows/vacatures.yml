name: Vacaturemonitor daily update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vacatures/pipeline/**"
      - "vacatures/tests/**"
      - "vacatures/data/sources.json"
      - "vacatures/data/employers.json"
      - ".github/workflows/vacatures.yml"

permissions:
  contents: write

concurrency:
  group: vacatures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s vacatures/tests -v

      - name: Check out private text archive (only when the token is set)
        if: env.HAS_ARCHIVE_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: mvanpassel-cmyk/vacatures-archief
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: private-archive

      - name: Fetch new vacancies, update status and archive copies
        run: |
          if [ "$HAS_ARCHIVE_TOKEN" = "true" ]; then
            python vacatures/pipeline/update.py --text-dir private-archive/teksten
          else
            python vacatures/pipeline/update.py
          fi

      - name: Push full texts to the private archive
        if: env.HAS_ARCHIVE_TOKEN == 'true'
        working-directory: private-archive
        run: |
          git config user.name "vacatures bot"
          git config user.email "actions@users.noreply.github.com"
          git add teksten
          if git diff --cached --quiet; then
            echo "No new texts"
            exit 0
          fi
          git commit -m "Teksten bijgewerkt $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin HEAD && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Commit if changed
        run: |
          git config user.name "vacatures bot"
          git config user.email "actions@users.noreply.github.com"
          git add vacatures/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Vacaturemonitor: daily update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
