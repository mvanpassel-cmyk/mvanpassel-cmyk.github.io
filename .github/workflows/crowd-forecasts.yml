name: Crowd Forecasts daily update

on:
  schedule:
    # GitHub often starts scheduled runs hours late (7-8 h measured on 9-10 Nov 2026), so this is set for just after midnight UTC to land before the Dutch working day.
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      outlook:
        description: "Write Claude's outlook now, even if it is not due"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "crowd-forecasts/fetch.mjs"
      - "crowd-forecasts/outlook.py"
      - ".github/workflows/crowd-forecasts.yml"

permissions:
  contents: write

concurrency:
  group: crowd-forecasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prediction markets
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: node crowd-forecasts/fetch.mjs

      - name: Outlook tests
        run: python3 -m unittest discover -s crowd-forecasts/tests

      # Settles calls from market prices daily (free); Claude writes the outlook once a week.
      - name: Claude's outlook and scoring
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_OUTLOOK: ${{ github.event.inputs.outlook }}
        run: python3 crowd-forecasts/outlook.py

      - name: Commit if changed
        run: |
          git config user.name "crowd-forecasts bot"
          git config user.email "actions@users.noreply.github.com"
          git add crowd-forecasts/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Crowd Forecasts: daily update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
