<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: one-screen game. Header bar, then score + found words, then input over a 7-cell honeycomb. Two columns on wide screens. */
:root{
  --bg:#ffffff; --fg:#121212; --muted:#6b6b6b; --line:#dcdcdc;
  --cell:#e6e6e6; --cell-press:#cfcfcf; --honey:#f7da21; --honey-ink:#121212;
  --panel:#ffffff; --scrim:rgba(255,255,255,.86); --toast:#121212; --toast-fg:#fff;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121213; --fg:#f2f2f2; --muted:#9a9a9a; --line:#3a3a3c;
  --cell:#3a3a3c; --cell-press:#565658; --honey:#f7da21; --honey-ink:#121212;
  --panel:#1c1c1e; --scrim:rgba(18,18,19,.86); --toast:#f2f2f2; --toast-fg:#121212; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121213; --fg:#f2f2f2; --muted:#9a9a9a; --line:#3a3a3c;
  --cell:#3a3a3c; --cell-press:#565658; --honey:#f7da21; --honey-ink:#121212;
  --panel:#1c1c1e; --scrim:rgba(18,18,19,.86); --toast:#f2f2f2; --toast-fg:#121212; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
html,body{touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.game,.entry{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tools{display:flex;gap:6px}
.tbtn{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;height:36px;padding:0 14px;font-size:.85rem;font-weight:600}
.tbtn.icon{width:36px;padding:0;font-size:1rem;font-weight:700}

main{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-block:14px 24px}
main>section{min-width:0}
@media (min-width:900px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start;padding-top:28px}.side{order:2}.game{order:1}}

/* progress */
.progress{display:flex;align-items:center;gap:14px;padding:6px 0 10px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.rank{font-weight:700;font-size:1rem;min-width:7.2em}
.track{position:relative;flex:1;height:30px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dots{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);position:relative}
.dot.on{background:var(--honey)}
.dot.cur{width:30px;height:30px;margin:0 -10px;background:var(--honey);color:var(--honey-ink);display:grid;place-items:center;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.dot.last{border-radius:2px}

/* found words */
.found{border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0;overflow:hidden}
.found-bar{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;font-size:.95rem;min-width:0}
.found-bar .recent{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.found-bar .recent.empty{color:var(--muted)}
.chev{transition:transform .2s}
.found.open .chev{transform:rotate(180deg)}
.found-list{display:none;padding:0 14px 14px}
.found.open .found-list{display:block}
.found-count{font-size:.9rem;margin:2px 0 10px;color:var(--muted)}
.cols{columns:2;column-gap:20px;list-style:none;margin:0;padding:0}
@media (min-width:500px){.cols{columns:3}}
.cols li{padding:7px 0;border-bottom:1px solid var(--line);text-transform:capitalize;break-inside:avoid;font-size:.95rem}
.cols li.pg{font-weight:800}
.cols li.miss{color:var(--muted)}
@media (min-width:900px){.found{min-height:420px}.found-bar{display:none}.found-list{display:block;padding-top:14px}}

/* input */
.game{display:flex;flex-direction:column;align-items:center}
.entry{position:relative;height:64px;width:100%;max-width:340px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.word{font-size:2rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center}
.word .c{color:#d4b500}
:root[data-theme="dark"] .word .c{color:var(--honey)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .word .c{color:var(--honey)}}
.word .x{color:var(--muted)}
.caret{width:2px;height:2.1rem;background:var(--honey);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.entry.shake .word{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.toast{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--toast);color:var(--toast-fg);font-size:.88rem;font-weight:600;padding:7px 12px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
.toast b{margin-left:8px}

/* hive */
.hive{position:relative;width:min(80vw,300px);aspect-ratio:312/324;max-width:100%;margin:18px 0 26px;transition:opacity .15s}
.hive.fade .outer text{opacity:0}
.cell{position:absolute;width:38.46%;height:32.1%;background:none;border:0;padding:0;touch-action:manipulation}
.cell svg{width:100%;height:100%;display:block;overflow:visible}
.cell polygon{fill:var(--cell);transition:fill .1s,transform .1s;transform-origin:center;transform-box:fill-box}
.cell.center polygon{fill:var(--honey)}
.cell:active polygon,.cell.down polygon{transform:scale(.92)}
.cell text{font-family:var(--ui);font-size:42px;font-weight:700;fill:var(--fg);text-transform:uppercase;transition:opacity .15s;pointer-events:none}
.cell.center text{fill:var(--honey-ink)}
.cell:focus-visible{outline:none}.cell:focus-visible polygon{stroke:var(--fg);stroke-width:3}

.controls{display:flex;gap:10px;align-items:center}
.pill{height:52px;min-width:96px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:1rem;font-weight:500}
.round{width:52px;min-width:52px;padding:0;display:grid;place-items:center}
.pill:active{background:var(--cell)}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.18);width:100%;max-width:460px;max-height:100%;overflow:auto;padding:24px 22px;position:relative}
.sheet h2{font-family:var(--display);font-size:1.6rem;margin:0 0 6px;text-wrap:balance}
.sheet h3{font-size:1rem;margin:18px 0 6px}
.sheet p,.sheet li{line-height:1.5;font-size:.95rem}
.sheet ul{padding-left:1.1em;margin:6px 0}
.sheet .fine{color:var(--muted);font-size:.8rem}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:none;font-size:1.4rem}
.ranks{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:10px}
.ranks td{padding:8px 4px;border-bottom:1px solid var(--line)}
.ranks td:last-child{text-align:right}
.ranks tr.now td{font-weight:800}
.ranks .sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:10px}
.ranks tr.reached .sw{background:var(--honey)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .pill{height:46px;font-size:.92rem;flex:1 1 auto}
.pill.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.answers{columns:2;column-gap:18px;list-style:none;padding:0;margin:12px 0 0}
.answers li{padding:4px 0;text-transform:capitalize;font-size:.92rem;break-inside:avoid}
.answers li.got{color:var(--muted);text-decoration:line-through}
.answers li.pg{font-weight:800}
.qb{display:grid;place-items:center;text-align:center}
.qb .big{font-size:3rem;line-height:1}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px;text-align:center}
.stats-grid div{border:1px solid var(--line);border-radius:8px;padding:10px 4px}
.stats-grid b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stats-grid span{font-size:.72rem;color:var(--muted);line-height:1.2;display:block;margin-top:3px}
.dist{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.dist td{padding:3px 0}
.dist td:first-child{width:7.5em;white-space:nowrap}
.dist td:last-child{width:2em;text-align:right;color:var(--muted)}
.bar{height:16px;border-radius:3px;background:var(--cell)}
.bar.hi{background:var(--honey)}
.sheet .hist{list-style:none;padding:0;margin:6px 0 0}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist .ltr{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hist .ltr i{font-style:normal;color:#d4b500}
:root[data-theme="dark"] .hist .ltr i{color:var(--honey)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hist .ltr i{color:var(--honey)}}
.hist .meta{color:var(--muted);font-size:.8rem}
.hist .sc{text-align:right;font-variant-numeric:tabular-nums}
.hist .rk{text-align:right;font-weight:600;font-size:.82rem}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:.8rem;text-decoration:underline;margin-top:16px}
@media (max-width:420px){.brand span{display:none}}
@media (max-width:380px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <div class="brand"><h1>Spellingbij</h1><span id="pnum"></span></div>
  <div class="tools">
    <button class="tbtn" id="newBtn" type="button">Nieuwe puzzel</button>
    <button class="tbtn icon" id="statsBtn" type="button" aria-label="Statistieken"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 14V9M8 14V3M13.5 14V6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button class="tbtn icon" id="helpBtn" type="button" aria-label="Spelregels">?</button>
  </div>
</header>

<main>
  <section class="side">
    <button class="progress" id="progress" type="button" aria-label="Bekijk rangen">
      <span class="rank" id="rank">Beginner</span>
      <span class="track"><span class="dots" id="dots"></span></span>
    </button>
    <div class="found" id="found">
      <button class="found-bar" id="foundBar" type="button" aria-expanded="false">
        <span class="recent empty" id="recent">Je woorden…</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div class="found-list">
        <p class="found-count" id="foundCount">Je hebt 0 woorden gevonden</p>
        <ul class="cols" id="cols"></ul>
      </div>
    </div>
  </section>

  <section class="game">
    <div class="entry" id="entry">
      <div class="toast" id="toast"></div>
      <div class="word" id="word"><span class="caret"></span></div>
    </div>
    <div class="hive" id="hive"></div>
    <div class="controls">
      <button class="pill" id="del" type="button">Wissen</button>
      <button class="pill round" id="shuf" type="button" aria-label="Husselen">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="pill" id="ent" type="button">Invoeren</button>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

    const center=letters[Math.floor(Math.random()*7)];
    const a=answersFor(letters,center);
    const max=a.list.reduce((s,w)=>s+pts(w,set),0);
    if(a.list.length>=20&&a.list.length<=60&&max<=260){
      return {letters:letters.join(""),center,outer:shuffle(letters.filter(c=>c!==center)),found:[],num:(S&&S.num?S.num+1:1),id:Date.now()+"-"+Math.random().toString(36).slice(2,7),start:Date.now()};
    }
  }
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let ANS=[],SET=0,MAX=0,ANSSET=new Set();
function setup(){
  if(!S.id){S.id="old-"+S.letters+S.center+"-"+(S.num||1);S.start=Date.now()}
  const a=answersFor([...S.letters],S.center);ANS=a.list;SET=a.set;ANSSET=new Set(ANS);
  MAX=ANS.reduce((s,w)=>s+pts(w,SET),0);
  S.found=S.found.filter(w=>ANSSET.has(w));
  typed="";buildHive();render();save();
}
function score(){return S.found.reduce((s,w)=>s+pts(w,SET),0)}
function thresholds(){return RANKS.map(([n,p])=>[n,Math.round(p/100*MAX)])}
function rankIdx(sc){const t=thresholds();let r=0;t.forEach(([n,v],i)=>{if(sc>=v)r=i});return r}

const POS=[[96,0],[192,55],[192,165],[96,220],[0,165],[0,55]];
function hexSVG(ch){return `<svg viewBox="0 0 120 104" aria-hidden="true"><polygon points="0,52 30,0 90,0 120,52 90,104 30,104"/><text x="60" y="54" text-anchor="middle" dominant-baseline="central">${ch.toUpperCase()}</text></svg>`}
function buildHive(){
  const h=$("hive");h.innerHTML="";
  const mk=(ch,l,t,cls)=>{const b=document.createElement("button");b.type="button";b.className="cell "+cls;
    b.style.left=(l/312*100)+"%";b.style.top=(t/324*100)+"%";b.innerHTML=hexSVG(ch);b.setAttribute("aria-label",ch.toUpperCase());
    b.dataset.ch=ch;b.addEventListener("click",()=>add(ch));h.appendChild(b)};
  mk(S.center,96,110,"center");
  S.outer.forEach((c,i)=>mk(c,POS[i][0],POS[i][1],"outer"));
}
function renderWord(){
  const el=$("word");el.innerHTML="";
  for(const c of typed){const s=document.createElement("span");s.textContent=c;if(c===S.center)s.className="c";else if(!S.letters.includes(c))s.className="x";el.appendChild(s)}
  const caret=document.createElement("span");caret.className="caret";el.appendChild(caret);
  const n=typed.length;el.style.fontSize=n>16?"1.25rem":n>11?"1.6rem":"";
}
function render(){
  renderWord();
  const sc=score(),ri=rankIdx(sc),qb=sc===MAX&&MAX>0;
  $("rank").textContent=qb?"Bijenkoningin":RANKS[ri][0];
  const d=$("dots");d.innerHTML="";
  RANKS.forEach((r,i)=>{const s=document.createElement("span");s.className="dot"+(i<ri?" on":"")+(i===RANKS.length-1?" last":"");
    if(i===ri){s.className+=" cur";s.textContent=sc}d.appendChild(s)});
  $("pnum").textContent="Puzzel "+S.num;
  const sorted=S.found.slice().sort((a,b)=>a.localeCompare(b,"nl"));
  $("foundCount").textContent=`Je hebt ${S.found.length} ${S.found.length===1?"woord":"woorden"} gevonden`;
  $("cols").innerHTML=sorted.map(w=>`<li class="${isPangram(w)?"pg":""}">${w}</li>`).join("");
  const r=$("recent");
  if(S.found.length){r.classList.remove("empty");r.textContent=S.found.slice().reverse().join("  ")}
  else{r.classList.add("empty");r.textContent="Je woorden…"}
}

let toastT;
function toast(msg,plus){const t=$("toast");t.innerHTML=msg+(plus?`<b>+${plus}</b>`:"");t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1200)}
function fail(msg){toast(msg);const e=$("entry");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");setTimeout(()=>{typed="";renderWord()},500)}

function add(c){if(typed.length<19){typed+=c;renderWord()}}
function del(){typed=typed.slice(0,-1);renderWord()}
function submit(){
  const w=typed;if(!w)return;
  if(w.length<4)return fail("Te kort");
  if([...w].some(c=>!S.letters.includes(c)))return fail("Verkeerde letters");
  if(!w.includes(S.center))return fail("Middelste letter ontbreekt");
  if(!ANSSET.has(w))return fail("Niet in woordenlijst");
  if(S.found.includes(w))return fail("Al gevonden");
  const before=rankIdx(score());
  S.found.push(w);save();
  const p=pts(w,SET);
  toast(isPangram(w)?"Pangram!":w.length===4?"Goed!":w.length<7?"Mooi!":"Geweldig!",p);
  typed="";render();
  const sc=score();
  if(sc===MAX)setTimeout(showQB,900);
  else{const after=rankIdx(sc);if(after===RANKS.length-1&&before<after)setTimeout(()=>toast("Genie! 🐝"),1300)}
}
function doShuffle(){const h=$("hive");h.classList.add("fade");setTimeout(()=>{S.outer=shuffle(S.outer);save();buildHive();requestAnimationFrame(()=>h.classList.remove("fade"))},150)}

/* modals */
function openModal(html){$("sheet").innerHTML=`<button class="close" type="button" aria-label="Sluiten">×</button>`+html;$("modal").hidden=false;
  $("sheet").querySelector(".close").onclick=closeModal;}
function closeModal(){$("modal").hidden=true}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function showHelp(){openModal(`<h2>Zo speel je</h2>
<p>Maak zoveel mogelijk woorden met de 7 letters van de honingraat.</p>
<ul>
<li>Woorden hebben minstens 4 letters.</li>
<li>Elk woord bevat de middelste letter.</li>
<li>Letters mag je vaker gebruiken.</li>
<li>Geen eigennamen, geen woorden met koppelteken, geen scheldwoorden.</li>
<li>IJ telt als twee letters: i + j. Accenten vallen weg (café wordt cafe).</li>
</ul>
<h3>Punten</h3>
<ul>
<li>Een woord van 4 letters: 1 punt.</li>
<li>Langere woorden: 1 punt per letter.</li>
<li>Elke puzzel heeft minstens één pangram: een woord met alle 7 letters. Dat levert 7 extra punten op.</li>
</ul>
<p>Op een toetsenbord kun je ook typen. Enter voert in, spatie husselt.</p>
<p class="fine">Woordenlijst: OpenTaal (opentaal.org), gefilterd op gangbare woorden met de Nederlandse frequentielijst van hermitdave/FrequencyWords. Niet verbonden aan The New York Times.</p>`)}

function showRanks(){
  const sc=score(),ri=rankIdx(sc),t=thresholds();
  const rows=t.map(([n,v],i)=>`<tr class="${i<=ri?"reached":""} ${i===ri?"now":""}"><td><span class="sw"></span>${n}</td><td>${v}</td></tr>`).reverse().join("");
  const need=ri<t.length-1?t[ri+1][1]-sc:0;
  openModal(`<h2>Rangen</h2><p>Rangen hangen af van het totaal aantal punten in deze puzzel. ${need?`Nog ${need} ${need===1?"punt":"punten"} tot <b>${t[ri+1][0]}</b>.`:"Je bent een genie. Vind alle woorden voor Bijenkoningin."}</p>
  <table class="ranks"><tbody>${sc===MAX?`<tr class="reached now"><td><span class="sw"></span>Bijenkoningin</td><td>${MAX}</td></tr>`:""}${rows}</tbody></table>`)}

function showAnswers(){
  const pg=ANS.filter(isPangram);
  openModal(`<h2>Oplossing</h2><p>${S.found.length} van ${ANS.length} woorden gevonden, ${score()} van ${MAX} punten. Pangram${pg.length>1?"s":""}: <b style="text-transform:uppercase">${pg.join(", ")}</b>.</p>
  <ul class="answers">${ANS.map(w=>`<li class="${S.found.includes(w)?"got":""} ${isPangram(w)?"pg":""}">${w}</li>`).join("")}</ul>
  <div class="actions"><button class="pill primary" id="goNew" type="button">Nieuwe puzzel</button></div>`);
  $("goNew").onclick=()=>{newPuzzle();closeModal()}
}
function askNew(){
  openModal(`<h2>Nieuwe puzzel?</h2><p>Je hebt ${S.found.length} van ${ANS.length} woorden gevonden. Je score gaat naar je statistieken; verder spelen aan deze puzzel kan daarna niet meer.</p>
  <div class="actions"><button class="pill primary" id="yesNew" type="button">Nieuwe puzzel</button><button class="pill" id="seeAns" type="button">Eerst oplossing tonen</button></div>`);
  $("yesNew").onclick=()=>{newPuzzle();closeModal()};$("seeAns").onclick=showAnswers;
}
function showQB(){openModal(`<div class="qb"><div class="big">🐝</div><h2>Bijenkoningin!</h2><p>Je hebt alle ${ANS.length} woorden gevonden: ${MAX} punten.</p>
  <div class="actions" style="width:100%"><button class="pill primary" id="qbNew" type="button">Nieuwe puzzel</button></div></div>`);$("qbNew").onclick=()=>{newPuzzle();closeModal()}}

function rankName(i){return i>=RANKS.length?"Bijenkoningin":RANKS[i][0]}
function fmtDate(t){try{return new Date(t).toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}catch(e){return ""}}
function showStats(){
  record();
  const h=loadHist();
  if(!h.length){openModal(`<h2>Statistieken</h2><p>Nog niets bijgehouden. Zodra je in een puzzel een woord vindt, komt hij hier te staan.</p>`);return}
  const n=h.length,qb=h.filter(x=>x.qb).length,genie=h.filter(x=>x.rank>=RANKS.length-1).length;
  const avg=Math.round(h.reduce((s,x)=>s+x.score/x.max,0)/n*100);
  const dist=new Array(RANKS.length+1).fill(0);h.forEach(x=>dist[Math.min(x.rank,RANKS.length)]++);
  const top=Math.max(...dist);
  const rows=dist.map((c,i)=>[i,c]).reverse().filter(([i,c])=>c||i>=4).map(([i,c])=>
    `<tr><td>${rankName(i)}</td><td><div class="bar ${i>=RANKS.length-1?"hi":""}" style="width:${top?Math.max(c/top*100,c?4:0):0}%"></div></td><td>${c}</td></tr>`).join("");
  const last=h.slice().sort((a,b)=>b.last-a.last).slice(0,10).map(x=>{
    const L=[...x.letters].map(c=>c===x.center?`<i>${c}</i>`:c).join("");
    const cur=x.id===S.id?" · bezig":"";
    return `<li><span class="ltr">${L}</span><span class="sc">${x.score}/${x.max}</span>
      <span class="meta">Puzzel ${x.num} · ${fmtDate(x.last)} · ${x.found}/${x.words} woorden${cur}</span><span class="rk">${rankName(x.rank)}</span></li>`}).join("");
  openModal(`<h2>Statistieken</h2>
  <div class="stats-grid"><div><b>${n}</b><span>Gespeeld</span></div><div><b>${genie}</b><span>Genie of hoger</span></div><div><b>${qb}</b><span>Bijen&shy;koningin</span></div><div><b>${avg}%</b><span>Gem. score</span></div></div>
  <h3>Hoogste rang per puzzel</h3><table class="dist"><tbody>${rows}</tbody></table>
  <h3>Laatste puzzels</h3><ul class="hist">${last}</ul>
  <p class="fine">Bewaard in deze browser, op dit apparaat.</p>
  <button class="linkbtn" id="clearStats" type="button">Statistieken wissen</button>`);
  $("clearStats").onclick=()=>{if(confirm("Alle statistieken wissen? De huidige puzzel blijft staan.")){saveHist([]);record();showStats()}};
}
function newPuzzle(){record();S=generate();setup()}

/* events */
$("del").onclick=del;$("ent").onclick=submit;$("shuf").onclick=doShuffle;
$("helpBtn").onclick=showHelp;$("statsBtn").onclick=showStats;$("progress").onclick=showRanks;
$("newBtn").onclick=()=>S.found.length?askNew():newPuzzle();
$("foundBar").onclick=()=>{const f=$("found");f.classList.toggle("open");$("foundBar").setAttribute("aria-expanded",f.classList.contains("open"))};
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!$("modal").hidden){if(e.key==="Escape")closeModal();return}
  const k=e.key.toLowerCase();
  if(/^[a-z]$/.test(k)){add(k);const c=document.querySelector(`.cell[data-ch="${k}"]`);if(c){c.classList.add("down");setTimeout(()=>c.classList.remove("down"),100)}e.preventDefault()}
  else if(e.key==="Backspace"){del();e.preventDefault()}
  else if(e.key==="Enter"){submit();e.preventDefault()}
  else if(e.key===" "){doShuffle();e.preventDefault()}
});

S=load();
if(!S){S=generate();setup();setTimeout(showHelp,300)}else setup();
})();
</script>

</body></html>
