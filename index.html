<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark van Passel — Tools & Experiments</title>
<meta name="description" content="A small collection of tools, instruments and experiments by Mark van Passel.">
<link rel="icon" type="image/png" sizes="32x32" href="logos/home-32.png">
<link rel="icon" type="image/svg+xml" href="logos/home.svg">
<link rel="apple-touch-icon" href="logos/home-180.png">
<style>
:root{
  --bg:#f6f4ef; --ink:#1c1f26; --muted:#667085; --card:#ffffff; --line:#e4e0d6; --accent:#1f3a5f;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161b; --ink:#eceae4; --muted:#9aa1ae; --card:#1c1f26; --line:#2b303a; --accent:#f4c95d;}
}
*{box-sizing:border-box}
/* Zachte CMYK-achtergrond: vier vage inktvlekken (cyaan, magenta, geel, key)
   op vaste positie, plus een heel lichte rasterpunt. Kaarten blijven dekkend. */
:root{--k:rgba(28,31,38,.07);--c:rgba(0,174,239,.15);--m:rgba(236,0,140,.11);--y:rgba(255,212,0,.17);--dot:rgba(28,31,38,.045)}
@media (prefers-color-scheme:dark){:root{--k:rgba(120,110,190,.10);--c:rgba(0,174,239,.18);--m:rgba(236,0,140,.14);--y:rgba(255,212,0,.09);--dot:rgba(236,234,228,.05)}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.5px) 0 0/14px 14px,
    radial-gradient(38rem 30rem at 8% 4%,var(--c),transparent 70%),
    radial-gradient(34rem 28rem at 96% 30%,var(--m),transparent 70%),
    radial-gradient(40rem 30rem at 30% 104%,var(--y),transparent 70%),
    radial-gradient(30rem 24rem at 62% 58%,var(--k),transparent 70%);}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:56px 16px 72px}
header h1 .mark{width:1.15em;height:1.15em;border-radius:.26em;vertical-align:-.2em;margin-right:.35em;box-shadow:0 1px 3px rgba(0,0,0,.12)}
header h1{font:600 clamp(28px,5vw,42px)/1.1 ui-serif,Georgia,serif;margin:0 0 10px;letter-spacing:-.01em}
header p{color:var(--muted);margin:0;max-width:56ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:32px 0 20px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{display:flex;gap:16px;align-items:flex-start;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);outline:none}
.card:focus-visible{border-color:var(--accent)}
.icon{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.icon svg,.icon img{width:100%;height:100%;display:block}
.body h2{font-size:17px;margin:0 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.body p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:48px;color:var(--muted);font-size:13px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="mark" src="logos/home.svg" alt="">Tools &amp; experiments</h1>
    <p>Small things I build for work, curiosity and sound. Each one lives in its own page — click to open.</p>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
  <main class="grid" id="grid"></main>

  <footer>By <a href="https://github.com/mvanpassel-cmyk">Mark van Passel</a> · built in the open on GitHub Pages</footer>
</div>

<script>
/* ------------------------------------------------------------
   ADD A NEW TOOL: copy one block below, change the fields, save.
   - repo:  GitHub repo name (page = https://mvanpassel-cmyk.github.io/<repo>/)
   - icon:  { glyph: "svg path content", from: "#hex", to: "#hex" }  or  { img: "url" }
   - cat:   any label; filter chips are generated automatically
   - lang:  optional, e.g. "NL" / "EN"
------------------------------------------------------------- */
const BASE = "https://mvanpassel-cmyk.github.io/";
const TOOLS = [
  { repo:"gh-ribbon", title:"Global Health Ribbon", cat:"Global health",
    desc:"A live feed of global health news and policy signals, aggregated from RSS sources.", lang:"EN",
    icon:{ from:"#1f6f78", to:"#0f3d4a",
      glyph:'<path d="M12 36c8-14 14-14 20 0s12 14 20 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M12 24c8-10 14-10 20 0s12 10 20 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>' } },

  { repo:"soundscape", title:"Soundscape", cat:"Sound",
    desc:"A browser-based ambient audio app for building slow, layered atmospheres.", lang:"EN",
    icon:{ img: "soundscape.png" } },

  { repo:"slowreverb", title:"SlowReverb Studio", cat:"Sound",
    desc:"Slow down any track and drench it in reverb — a slowed + reverb audio editor.", lang:"NL",
    icon:{ from:"#6d3fc0", to:"#2a1a5e",
      glyph:'<g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="4"><path d="M10 28v8M18 22v20M26 16v32M34 20v24M42 26v12"/><path stroke-opacity=".45" d="M50 30v4"/></g>' } },

  { repo:"tape-loops", title:"Tape Loops", cat:"Sound",
    desc:"A generative tape loop machine: five loops of different lengths drift against each other. Soft synths or your own recorded sounds, with WAV and MP3 export.", lang:"EN",
    icon:{ from:"#2b2f45", to:"#12141f",
      glyph:'<g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="8"/></g><circle cx="32" cy="10" r="3.5" fill="#f4c95d"/><circle cx="47" cy="32" r="3.5" fill="#7fc4b8"/><circle cx="32" cy="40" r="3.5" fill="#c98fd1"/>' } },

  { repo:"trip-score", title:"Trip Score", cat:"Sound",
    desc:"A quiet, generative film score for travelling, played on real orchestral recordings: fifteen moods from Dreamy and Sci-fi to French Noir and Western, plus Shuffle. Works offline and with the screen off.", lang:"EN",
    icon:{ from:"#3b2a6b", to:"#0b0b10",
      glyph:'<path d="M10 40c6-10 11-10 16 0s10 10 16 0 9-9 12-4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="46" cy="18" r="4" fill="#ffcb9a"/>' } },

  { repo:"the-machine", title:"The Machine", cat:"Experiments",
    desc:"Five superfluous instruments for the human shortcoming: nonchalance, apathy, Maslow, knowledge, and a machine that describes you while you read.", lang:"EN",
    icon:{ from:"#3b3f4a", to:"#16181d",
      glyph:'<circle cx="32" cy="32" r="9" fill="none" stroke="#f4c95d" stroke-width="4"/><g stroke="#f4c95d" stroke-width="4" stroke-linecap="round"><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l6 6M43 43l6 6M49 15l-6 6M21 43l-6 6"/></g>' } },

  { repo:"hijtje", title:"Hijtje", cat:"Experiments",
    desc:"Plak het NRC-ikje van vandaag en lees hetzelfde voorval vanuit de ander, die er niets van doorhad.", lang:"NL",
    icon:{ from:"#1a4c8b", to:"#0d2a4f",
      glyph:'<path d="M12 32h30M32 20l12 12-12 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' } },

  { repo:"nphi-map", title:"NPHI Collaboration Map", cat:"Global health",
    desc:"World map of who works with whom: national public health institutes' projects abroad, ongoing and finished, with sources.", lang:"EN",
    icon:{ from:"#1f6f78", to:"#173b5c",
      glyph:'<circle cx="32" cy="32" r="20" fill="none" stroke="#fff" stroke-width="3"/><path d="M12 32h40M32 12c-8 6-8 34 0 40M32 12c8 6 8 34 0 40" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><path d="M20 26Q32 14 44 38" fill="none" stroke="#f4c95d" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="26" r="3" fill="#f4c95d"/><circle cx="44" cy="38" r="3" fill="#f4c95d"/>' } },

  { repo:"jee-good-practices", title:"JEE Good Practices", cat:"Global health",
    desc:"WHO JEE indicators, evidence and country capacity scores.", lang:"EN",
    icon:{ from:"#1f3a5f", to:"#0f2038",
      glyph:'<path d="M12 44h10V34h10V24h10V16h10" fill="none" stroke="#f4c95d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="16" r="3.5" fill="#fff"/><path d="M12 52h40" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>' } },
  { repo:"ihr-benchmarks-good-practices", title:"IHR Benchmarks Good Practices", cat:"Global health", desc:"Published good practices and case studies for each WHO IHR benchmark, linked to JEE scores.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<path d="M14 34l9 9 19-22" fill="none" stroke="#f4c95d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' } },
  { repo:"spar-good-practices", title:"SPAR Good Practices", cat:"Global health", desc:"WHO SPAR indicators with literature case studies, JEE scores and IHR benchmarks.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<path d="M12 46h8V36h8V26h8V18h8" fill="none" stroke="#f4c95d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="16" r="4" fill="#f4c95d"/>' } },
  { repo:"ianphi-good-practices", title:"NPHI Good Practices", cat:"Global health", desc:"IANPHI staged development tool for national public health institutes, with case studies and peer reviews.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<path d="M12 48h40M16 48V28l16-12 16 12v20" fill="none" stroke="#f4c95d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 48V36h12v12" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>' } },
  { repo:"tracss-good-practices", title:"TrACSS 2025", cat:"Global health", desc:"All questions of the Quadripartite AMR self-assessment survey with every country's 2025 answers, comparisons and links to JEE, SPAR and PHEPA.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<path d="M12 46h8V36h8V26h8V18h8" fill="none" stroke="#f4c95d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 52h40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>' } },
  { repo:"woah-pvs-good-practices", title:"WOAH PVS Pathway", cat:"Global health", desc:"The 45 critical competencies of the WOAH PVS Tool, the IHR-PVS bridge to JEE, with literature.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<path d="M32 10l17 6v14c0 11-7.500 18-17 22-9.500-4-17-11-17-22V16z" fill="none" stroke="#f4c95d" stroke-width="3.500" stroke-linejoin="round"/><circle cx="32" cy="30" r="5" fill="#fff"/>' } },
  { repo:"psychohistory", title:"Psychohistory", cat:"Global health", desc:"Global health forecasting: news, calibrated forecasts and regular review of what came true.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<circle cx="32" cy="32" r="18" fill="none" stroke="#f4c95d" stroke-width="4"/><path d="M32 20v12l8 5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' } },
  { repo:"crowd-forecasts", title:"Wisdom of the Crows", cat:"Experiments", desc:"What six prediction markets and forecasting sites expect on wars, elections, trade and health, on a timeline by when we'll know. Updated daily.", lang:"EN", icon:{ from:"#1f3a5f", to:"#0f2038", glyph:'<path d="M12 44l12-12 9 7 19-21" fill="none" stroke="#f4c95d" stroke-width="4.500" stroke-linecap="round" stroke-linejoin="round"/><g fill="#fff"><circle cx="16" cy="52" r="2.500"/><circle cx="28" cy="52" r="2.500"/><circle cx="40" cy="52" r="2.500"/><circle cx="52" cy="52" r="2.500" fill-opacity=".45"/></g>' } },
  { repo:"risk-radar", title:"Risk Radar", cat:"Global health",
    desc:"Connecting the dots between emerging global risks: what institutions warn about, how they know, and how the risks connect. Checked daily.", lang:"EN",
    icon:{ img:"logos/risk-radar.svg" } },
  { repo:"phepa-good-practices", title:"PHEPA Good Practices", cat:"Global health",
    desc:"ECDC preparedness assessments: strengths and recommendations by topic.", lang:"EN",
    icon:{ from:"#1d3f8a", to:"#0f2358",
      glyph:'<path d="M32 10l17 6v14c0 11-7.500 18-17 22-9.500-4-17-11-17-22V16z" fill="none" stroke="#f4c95d" stroke-width="3.500" stroke-linejoin="round"/><path d="M24 32l6 6 11-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' } },



];

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
let active = "All";

function iconHTML(t, i){
  return `<div class="icon"><img src="logos/${t.repo}.svg" alt="" loading="lazy"></div>`;
  if (t.icon.img) return `<div class="icon"><img src="${t.icon.img}" alt="" loading="lazy"></div>`;
  const id = "g"+i;
  return `<div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.icon.from}"/><stop offset="1" stop-color="${t.icon.to}"/></linearGradient></defs><rect width="64" height="64" fill="url(#${id})"/>${t.icon.glyph}</svg></div>`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  grid.innerHTML = TOOLS.filter(t=>active==="All"||t.cat===active).map((t,i)=>`
    <a class="card" href="${t.url || BASE+t.repo+'/'}">
      ${iconHTML(t,i)}
      <div class="body">
        <h2>${esc(t.title)}${t.lang?`<span class="lang">${t.lang}</span>`:""}</h2>
        <p>${esc(t.desc)}</p>
      </div>
    </a>`).join("");
}
function renderFilters(){
  const cats = ["All", ...new Set(TOOLS.map(t=>t.cat))];
  filters.innerHTML = cats.map(c=>`<button class="chip" aria-pressed="${c===active}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
filters.addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  active = b.dataset.c; renderFilters(); render();
});
renderFilters(); render();
</script>
</body>
</html>
